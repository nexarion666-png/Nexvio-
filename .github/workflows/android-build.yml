name: Android build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Provision Gradle and generate standard wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate wrapper JAR and scripts
        run: gradle wrapper --gradle-version 8.9
      - name: Accept SDK licenses and install platform
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexvio-Phase-1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
